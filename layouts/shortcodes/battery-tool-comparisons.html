<div id="tool-comparison" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 800px; margin: 0 auto;">
<style>
  #tool-comparison { --green: #4CAF50; --yellow: #F5C518; --cyan: #00ACC1; --red: #E53935; --bg: #0f1117; --card: #1a1d27; --card2: #2a2f3e; --card3: #222639; color: #e0e0e0; background: var(--bg); padding: 20px 12px; border-radius: 12px; }
  #tool-comparison * { box-sizing: border-box; }
  #tool-comparison h2 { font-size: 20px; font-weight: 700; text-align: center; margin: 0 0 4px; color: #fff; }
  #tool-comparison .subtitle { text-align: center; font-size: 11px; color: #888; margin: 0 0 16px; }
  #tool-comparison .tabs { display: flex; gap: 3px; margin-bottom: 16px; background: var(--card); border-radius: 10px; padding: 3px; }
  #tool-comparison .tabs button { flex: 1; padding: 10px 0; border: none; border-radius: 8px; cursor: pointer; background: transparent; color: #666; font-weight: 400; font-size: 13px; font-family: inherit; transition: all 0.2s; }
  #tool-comparison .tabs button.active { background: var(--card2); color: #fff; font-weight: 700; }
  #tool-comparison .tool-card { background: var(--card); border-radius: 10px; padding: 12px; margin-bottom: 8px; }
  #tool-comparison .tool-card h3 { font-size: 13px; font-weight: 700; color: #fff; margin: 0 0 8px; }
  #tool-comparison .brand-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  #tool-comparison .brand-cell { background: var(--bg); border-radius: 8px; padding: 7px 9px; border-left: 3px solid; }
  #tool-comparison .brand-cell .brand-name { font-size: 11px; font-weight: 700; }
  #tool-comparison .brand-cell .model { font-size: 10px; color: #999; margin-top: 1px; }
  #tool-comparison .brand-cell .price { font-size: 13px; font-weight: 700; color: #fff; margin-top: 2px; }
  #tool-comparison .battery-card { border: 1px dashed #444; }
  #tool-comparison .battery-card .model { font-size: 9px; line-height: 1.3; }
  #tool-comparison .totals { background: var(--card3); border-radius: 10px; padding: 14px 12px; margin-top: 4px; }
  #tool-comparison .totals h3 { font-size: 13px; font-weight: 700; color: #fff; margin: 0 0 10px; }
  #tool-comparison .total-cell { background: var(--bg); border-radius: 8px; padding: 10px; border-left: 3px solid; }
  #tool-comparison .total-cell.lowest { outline: 2px solid; }
  #tool-comparison .total-cell .total-price { font-size: 18px; font-weight: 700; color: #fff; margin-top: 2px; }
  #tool-comparison .total-cell .coverage { font-size: 9px; color: var(--green); margin-top: 2px; }
  #tool-comparison .total-cell .lowest-tag { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; }
  #tool-comparison .footnote { font-size: 10px; color: #555; margin-top: 8px; line-height: 1.5; }
  #tool-comparison .tab-content { display: none; }
  #tool-comparison .tab-content.active { display: block; }
  /* Pros & Cons */
  #tool-comparison .pc-card { background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 16px; border-left: 3px solid; }
  #tool-comparison .pc-card h3 { margin: 0 0 10px; font-size: 15px; font-weight: 700; }
  #tool-comparison .pc-card h3 span { font-size: 11px; font-weight: 400; color: #666; }
  #tool-comparison .pc-label { font-size: 10px; font-weight: 700; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
  #tool-comparison .pc-label.pro { color: var(--green); }
  #tool-comparison .pc-label.con { color: var(--red); }
  #tool-comparison .pc-item { font-size: 12px; padding: 3px 0; line-height: 1.5; }
  #tool-comparison .pc-item.pro { color: #ccc; }
  #tool-comparison .pc-item.con { color: #999; }
  #tool-comparison .pc-section { margin-bottom: 10px; }
  /* Score calc */
  #tool-comparison .slider-group { background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 16px; }
  #tool-comparison .slider-row { margin-bottom: 12px; }
  #tool-comparison .slider-header { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 3px; }
  #tool-comparison .slider-header span:first-child { font-weight: 500; }
  #tool-comparison .slider-header span:last-child { color: #888; }
  #tool-comparison input[type=range] { width: 100%; accent-color: #6C63FF; }
  #tool-comparison .score-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #tool-comparison .score-card { background: var(--card); border-radius: 12px; padding: 14px; border: 1px solid var(--card2); position: relative; }
  #tool-comparison .score-card.best { border-width: 2px; }
  #tool-comparison .score-card .best-tag { position: absolute; top: -8px; right: 10px; color: #000; font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
  #tool-comparison .score-card .score-val { font-size: 26px; font-weight: 700; }
  #tool-comparison .score-card .score-name { font-size: 13px; font-weight: 600; color: #fff; margin-top: 2px; }
  #tool-comparison .score-card .score-sub { font-size: 10px; color: #666; }
  #tool-comparison .score-bar-row { display: flex; align-items: center; gap: 5px; margin-bottom: 3px; }
  #tool-comparison .score-bar-label { font-size: 10px; color: #666; width: 56px; }
  #tool-comparison .score-bar-track { flex: 1; background: var(--bg); border-radius: 3px; height: 5px; }
  #tool-comparison .score-bar-fill { height: 100%; border-radius: 3px; opacity: 0.7; }
  #tool-comparison .score-bar-val { font-size: 10px; color: #888; width: 14px; text-align: right; }
  #tool-comparison .score-note { font-size: 12px; color: #888; margin-bottom: 14px; line-height: 1.5; }
</style>
 
<h2>Power Tool Brand Comparison</h2>
<p class="subtitle">Upgrading your primary home toolkit · old Ryobi set goes to vacation property · 11 tools compared</p>
 
<div class="tabs">
  <button class="active" onclick="tcShowTab('table',this)">Comparison</button>
  <button onclick="tcShowTab('proscons',this)">Pros &amp; Cons</button>
  <button onclick="tcShowTab('score',this)">Score Calc</button>
</div>
 
<!-- ═══ COMPARISON TAB ═══ -->
<div id="tc-table" class="tab-content active"></div>
 
<!-- ═══ PROS & CONS TAB ═══ -->
<div id="tc-proscons" class="tab-content"></div>
 
<!-- ═══ SCORE CALC TAB ═══ -->
<div id="tc-score" class="tab-content"></div>
 
<script>
(function(){
  const TOOLS = [
    { name:"Impact Wrench", ryobiHP:{m:"PBLID01",p:139}, dewalt:{m:"DCF899B",p:199}, makita:{m:"XWT18Z",p:279}, milwaukee:{m:"2767-20",p:299} },
    { name:"Drill / Driver", ryobiHP:{m:"PBLDD01",p:89}, dewalt:{m:"DCD800B",p:149}, makita:{m:"XFD14Z",p:149}, milwaukee:{m:"2903-20",p:129} },
    { name:"Orbital Sander", ryobiHP:{m:"PBLSD01",p:119}, dewalt:{m:"DCW210B",p:139}, makita:{m:"XOB02Z",p:119}, milwaukee:{m:"2648-20",p:129} },
    { name:"Jigsaw", ryobiHP:{m:"PBLJS01",p:99}, dewalt:{m:"DCS334B",p:179}, makita:{m:"XVJ02Z",p:229}, milwaukee:{m:"2737-20",p:199} },
    { name:"Circular Saw", ryobiHP:{m:"PBLCS300",p:139}, dewalt:{m:"DCS570B",p:149}, makita:{m:"XSH06Z",p:199}, milwaukee:{m:"2732-20",p:199} },
    { name:"Inflator", ryobiHP:{m:"P737D",p:29}, dewalt:{m:"DCC020IB",p:99}, makita:{m:"DMP180ZX",p:89}, milwaukee:{m:"2475-20",p:99} },
    { name:"Leaf Blower", ryobiHP:{m:"PBLB01",p:129}, dewalt:{m:"DCBL722B",p:149}, makita:{m:"XBU04Z",p:199}, milwaukee:{m:"2724-20",p:179} },
    { name:"Lawn Mower", ryobiHP:{m:"P1109BTL",p:299}, dewalt:{m:"DCMWP233",p:449}, makita:{m:"XML08Z",p:499}, milwaukee:{m:"2823-20",p:449} },
    { name:"String Trimmer", ryobiHP:{m:"PBLST01",p:129}, dewalt:{m:"DCST922B",p:149}, makita:{m:"XRU15Z",p:199}, milwaukee:{m:"2828-20",p:199} },
    { name:"Sliding Miter Saw", ryobiHP:{m:"PBT01B",p:199}, dewalt:{m:"DCS361B",p:299}, makita:{m:"XSL06Z",p:599}, milwaukee:{m:"2733-20",p:499} },
    { name:"Wet/Dry Vacuum", ryobiHP:{m:"PCL735B (6 gal)",p:99}, dewalt:{m:"DCV581H (2 gal)",p:149}, makita:{m:"XCV11Z (2.1 gal)",p:179}, milwaukee:{m:"0910-20 (6 gal)",p:249} }
  ];
  const BATT = { ryobiHP:{m:"PSK1210 (2×4Ah + charger)",p:139}, dewalt:{m:"DCB246CK (4+6Ah + charger)",p:199}, makita:{m:"BL1850B-2 + DC18RC",p:199}, milwaukee:{m:"48-59-1862S (2×6Ah + charger)",p:299} };
  const BRANDS = [
    {key:"ryobiHP",label:"Ryobi HP",color:"#4CAF50",platform:"18V ONE+"},
    {key:"dewalt",label:"DeWalt",color:"#F5C518",platform:"20V MAX"},
    {key:"makita",label:"Makita",color:"#00ACC1",platform:"18V LXT"},
    {key:"milwaukee",label:"Milwaukee",color:"#E53935",platform:"M18"}
  ];
  const PC = {
    ryobiHP: {
      pros:["Lowest total cost even buying new batteries","Largest cordless ecosystem (300+ tools)","Zero learning curve — same platform you know","Great combo kit deals to build out fast"],
      cons:["Not built for daily professional abuse","Lower torque ceiling vs pro brands","No tool tracking features","HP tools still lag FUEL/XR in testing"]
    },
    dewalt: {
      pros:["Widest retail availability (HD + Lowe's + independents)","FlexVolt 60V backward-compatible for heavy tools","Tool Connect Bluetooth tracking","Best overall value among pro brands"],
      cons:["20V MAX naming is confusing (really 18V nominal)","Battery ecosystem split (20V / FlexVolt)","Outdoor tools lag slightly behind competitors","Higher cost than Ryobi across the board"]
    },
    makita: {
      pros:["Outstanding build quality & ergonomics","Lowest vibration, smoothest operation","World's largest pro cordless platform","Excellent long-term reliability"],
      cons:["Mower & trimmer need 36V (two 18V batteries)","Slightly less raw torque than Milwaukee","Fewer specialty/lifestyle tools","Most expensive total cost in this comparison"]
    },
    milwaukee: {
      pros:["Highest torque & power across the board","ONE-KEY Bluetooth tracking & customization","M18 FUEL is best-in-class for most categories","FORGE batteries are industry-leading tech"],
      cons:["Most expensive per-tool pricing","Overkill for weekend DIY use","Home Depot exclusive — limited retail options","Batteries are priciest per Ah"]
    }
  };
  const SCORES = { ryobiHP:{power:6,value:10,ecosystem:10,durability:6}, dewalt:{power:8,value:7,ecosystem:8,durability:8}, makita:{power:8,value:6,ecosystem:8,durability:9}, milwaukee:{power:10,value:5,ecosystem:8,durability:9} };
  const catLabel = {power:"Power",value:"Value",ecosystem:"Ecosystem",durability:"Durability"};
  let weights = {power:25,value:30,ecosystem:25,durability:20};
 
  function fmt(n){ return "$"+n.toLocaleString(); }
  function totalCost(bk){ return TOOLS.reduce((s,t)=>s+t[bk].p,0)+BATT[bk].p; }
  function wScore(bk){
    const s=SCORES[bk]; let t=0,ws=0;
    for(const k in weights){t+=s[k]*weights[k];ws+=weights[k];}
    return (t/(ws||1)).toFixed(1);
  }
 
  function cell(b,d,small){
    return `<div class="brand-cell" style="border-color:${b.color}">
      <div class="brand-name" style="color:${b.color}">${b.label}</div>
      <div class="model">${d.m}</div>
      <div class="price">${fmt(d.p)}</div></div>`;
  }
 
  function renderTable(){
    let h='';
    TOOLS.forEach(t=>{
      h+=`<div class="tool-card"><h3>${t.name}</h3><div class="brand-grid">`;
      BRANDS.forEach(b=>{ h+=cell(b,t[b.key]); });
      h+=`</div></div>`;
    });
    h+=`<div class="tool-card battery-card"><h3>🔋 Battery Starter Kit</h3><div class="brand-grid">`;
    BRANDS.forEach(b=>{ h+=cell(b,BATT[b.key],true); });
    h+=`</div></div>`;
    const sorted=BRANDS.map(b=>({...b,total:totalCost(b.key)})).sort((a,b)=>a.total-b.total);
    h+=`<div class="totals"><h3>Estimated Total (all tools + batteries)</h3><div class="brand-grid">`;
    sorted.forEach((b,i)=>{
      h+=`<div class="total-cell${i===0?' lowest':''}" style="border-color:${b.color};${i===0?'outline-color:'+b.color:''}">`;
      if(i===0) h+=`<div class="lowest-tag" style="color:${b.color}">Lowest</div>`;
      h+=`<div class="brand-name" style="color:${b.color}">${b.label}</div>
        <div class="total-price">${fmt(b.total)}</div>
        <div class="coverage">✓ full coverage</div></div>`;
    });
    h+=`</div></div><p class="footnote">Prices are approximate bare-tool MSRP as of spring 2026. Watch for combo kit and "free tool with battery" promos — they can cut 30–50% off these totals.</p>`;
    document.getElementById('tc-table').innerHTML=h;
  }
 
  function renderPC(){
    let h='';
    BRANDS.forEach(b=>{
      const d=PC[b.key];
      h+=`<div class="pc-card" style="border-color:${b.color}"><h3 style="color:${b.color}">${b.label} <span>${b.platform} · ${fmt(totalCost(b.key))}</span></h3>`;
      h+=`<div class="pc-section"><div class="pc-label pro">Pros</div>`;
      d.pros.forEach(p=>{ h+=`<div class="pc-item pro"><span style="color:var(--green);margin-right:6px">+</span>${p}</div>`; });
      h+=`</div><div><div class="pc-label con">Cons</div>`;
      d.cons.forEach(c=>{ h+=`<div class="pc-item con"><span style="color:var(--red);margin-right:6px">−</span>${c}</div>`; });
      h+=`</div></div>`;
    });
    document.getElementById('tc-proscons').innerHTML=h;
  }
 
  function renderScore(){
    let h=`<p class="score-note">Drag sliders to match your priorities. Rankings update in real time.</p><div class="slider-group">`;
    for(const k in weights){
      h+=`<div class="slider-row"><div class="slider-header"><span>${catLabel[k]}</span><span id="tc-wlabel-${k}">${weights[k]}%</span></div>
        <input type="range" min="0" max="100" value="${weights[k]}" oninput="tcUpdateWeight('${k}',this.value)"></div>`;
    }
    h+=`</div><div class="score-grid" id="tc-score-cards"></div><p class="footnote">Scores are editorial estimates (10 = best). Adjust weights to see how rankings shift.</p>`;
    document.getElementById('tc-score').innerHTML=h;
    renderCards();
  }
 
  function renderCards(){
    const sorted=BRANDS.map(b=>({...b,sc:wScore(b.key)})).sort((a,b)=>b.sc-a.sc);
    let h='';
    sorted.forEach((b,i)=>{
      h+=`<div class="score-card${i===0?' best':''}" style="${i===0?'border-color:'+b.color:''}">`;
      if(i===0) h+=`<div class="best-tag" style="background:${b.color}">BEST FIT</div>`;
      h+=`<div class="score-val" style="color:${b.color}">${b.sc}</div>
        <div class="score-name">${b.label}</div>
        <div class="score-sub">${b.platform} · ${fmt(totalCost(b.key))}</div><div style="margin-top:8px">`;
      const s=SCORES[b.key];
      for(const cat in s){
        h+=`<div class="score-bar-row"><span class="score-bar-label">${catLabel[cat]}</span>
          <div class="score-bar-track"><div class="score-bar-fill" style="width:${s[cat]*10}%;background:${b.color}"></div></div>
          <span class="score-bar-val">${s[cat]}</span></div>`;
      }
      h+=`</div></div>`;
    });
    document.getElementById('tc-score-cards').innerHTML=h;
  }
 
  window.tcShowTab = function(id,btn){
    document.querySelectorAll('#tool-comparison .tab-content').forEach(e=>e.classList.remove('active'));
    document.querySelectorAll('#tool-comparison .tabs button').forEach(e=>e.classList.remove('active'));
    document.getElementById('tc-'+id).classList.add('active');
    btn.classList.add('active');
  };
  window.tcUpdateWeight = function(k,v){
    weights[k]=parseInt(v);
    document.getElementById('tc-wlabel-'+k).textContent=v+'%';
    renderCards();
  };
 
  renderTable(); renderPC(); renderScore();
})();
</script>
</div>
